<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/new_shortcut.png" />
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/studentDetails.css">
    <script src="/src/js/auth-check.js"></script>
    <script type="module" src="/src/js/global.js"></script>
    <script type="module" src="/src/js/studentDetails.js"></script>
    <title>Dethloff App</title>
</head>
<body>
    <header>
        <h1> Uczeń </h1>
        <div id="buttonColumns">
            <div class="defaultButtons">
                <button type="button" id="goBack" class="btn btn-info">
                    Powrót
                </button>
                <button type="button" id="logOut" class="btn btn-danger">
                    Wyloguj
                </button>
            </div>
            <div id="studentSpecificButtons" class="pageSpecificButtons">
                <button type="button" id="edit" class="btn btn-warning">
                    Edytuj
                </button>
                <button type="button" id="delete" class="btn btn-danger">
                    Usuń ucznia
                </button>
            </div>
        </div>
    </header>
    <main>
        <section id="basicData">
            <h2> Dane podstawowe </h2>
            <label for="studentName">Imię:</label>
            <input type="text" id="studentName" value="" readonly/>            
            <label for="studentSurname">Nazwisko:</label>
            <input type="text" id="studentSurname" value="" readonly/>
            <label for="studentGender">Płeć:</label>
            <select id="studentGender" disabled>
                <option value="DEFAULT">Domyślna</option>
                <option value="MALE">Mężczyzna</option>
                <option value="FEMALE">Kobieta</option>
            </select>
            <label for="studentPESEL">PESEL:</label>
            <input type="text" id="studentPESEL" value="" readonly/>            
            <label for="studentBirthDate">Data urodzenia:</label>
            <input type="text" id="studentBirthDate" value="" readonly/>            
            <label for="studentBirthPlace">Miejsce urodzenia urodzenia:</label>
            <input type="text" id="studentBirthPlace" value="" readonly/>            

        </section>
        <section id="contactData">
            <h2> Dane kontatkowe </h2>  
            <label for="studentCity">Miasto:</label>
            <input type="text" id="studentCity" value="" readonly/>            
            <label for="studentStreet">Ulica:</label>
            <input type="text" id="studentStreet" value="" readonly/>            
            <label for="StudentBuildingNumber">Nr. domu/lokalu:</label>
            <input type="text" id="studentBuildingNumber" value="" readonly/>            
            <label for="studentPostcode">Kod pocztowy:</label>
            <input type="text" id="studentPostcode" value="" readonly/>            
            <label for="studentPhoneNumber">Nr. telefonu:</label>
            <input type="text" id="studentPhoneNumber" value="" readonly/>  
            <label for="studentEmail">Email:</label>
            <input type="text" id="studentEmail" value="" readonly/>  
        </section>
        <section id="guardianData">
            <h2> Dane opiekuna </h2>
            <label for="studentGuardianName">Imię:</label>
            <input type="text" id="studentGuardianName" value="" readonly/>            
            <label for="studentGuardianSurname">Nazwisko:</label>
            <input type="text" id="studentGuardianSurname" value="" readonly/>            
            <label for="studentGuardianPhoneNumber">Nr. telefonu:</label>
            <input type="text" id="studentGuardianPhoneNumber" value="" readonly/>            
            <label for="studentGuardianEmail">Email:</label>
            <input type="text" id="studentGuardianEmail" value="" readonly/>
            <label for="studentGuardianCity">Miasto:</label>
            <input type="text" id="studentGuardianCity" value="" readonly/>            
            <label for="studentGuardianStreet">Ulica:</label>
            <input type="text" id="studentGuardianStreet" value="" readonly/>            
            <label for="StudentGuardianBuildingNumber">Nr. domu/lokalu:</label>
            <input type="text" id="studentGuardianBuildingNumber" value="" readonly/>            
            <label for="studentGuardianPostcode">Kod pocztowy:</label>
            <input type="text" id="studentGuardianPostcode" value="" readonly/>         
        </section>
        <section id="companyData"> 
            <h2> Dane firmy </h2>
            <label for="studentCompanyName">Nazwa:</label>
            <input type="text" id="studentCompanyName" value="" readonly/>            
            <label for="studentNIP">NIP:</label>
            <input type="text" id="studentNIP" value="" readonly/>    
            <label for="studentCompanyPhoneNumber">Nr. telefonu:</label>
            <input type="text" id="studentCompanyPhoneNumber" value="" readonly/>   
            <label for="studentCompanyEmail">Email:</label>
            <input type="text" id="studentCompanyEmail" value="" readonly/>
            <label for="studentCompanyCity">Miasto:</label>
            <input type="text" id="studentCompanyCity" value="" readonly/>            
            <label for="studentCompanyStreet">Ulica:</label>
            <input type="text" id="studentCompanyStreet" value="" readonly/>            
            <label for="studentCompanyBuildingNumber">Nr. domu/lokalu:</label>
            <input type="text" id="studentCompanyBuildingNumber" value="" readonly/>            
            <label for="studentCompanyPostcode">Kod pocztowy:</label>
            <input type="text" id="studentCompanyPostcode" value="" readonly/> 
        </section>
        <section id="marketingData">
            <h2> Dane marketingowe </h2>
            <label for="studentSource">Źródło pozyskania:</label>
            <input type="text" id="studentSource" value="" readonly/>            
            <label for="studentJoiningYear">Rok dołączenia:</label>
            <input type="text" id="studentJoiningDate" value="" readonly/>       
        </section>
    </main>
    <footer>

    </footer>
</body>
<dialog id="deleteModal">
  <h2>Czy na pewno chcesz usunąć ucznia?</h2>
  <p>Ta akcja jest nieodwracalna. Dane studenta zostaną trwale usunięte.</p>
  
  <div class="modal-actions">
    <button id="cancelBtn" type="button">Anuluj</button>
    <button id="confirmBtn" type="button" class="btn-danger">Usuń</button>
  </div>
</dialog>
</html>
