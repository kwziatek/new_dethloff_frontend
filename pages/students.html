<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/new_shortcut.png" />
    <link rel="stylesheet" href="/src/css/students.css">
    <script src="/src/js/auth-check.js"></script>
    <script type="module" src="/src/js/global.js"></script>
    <script type="module" src="/src/js/students.js"></script>
    <title>Dethloff App</title>
</head>
<body>
    <header>
        <h1> Uczniowie </h1>
        <div id="buttonColumns">
            <div class="defaultButtons">
                <div id="goBack">
                Powrót
                </div>
                <div id="logOut">
                    Wyloguj
                </div>
            </div>
            <div class="pageSpecificButtons">
                <div id="addStudent">
                    Dodaj ucznia
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="filterBarSection">
            <input id="filterBar" placeholder="Wyszukaj ucznia" autofocus autocomplete="off">
        </div>
        <div class="setOfStudents">
        </div>
    </main>
    <footer>

    </footer>
</body>

<dialog id="studentModal">
    <form method="dialog" id="studentForm">
        <h3> Dodawanie ucznia </h3>
        <input name="name" type="text" placeholder="Imię" required autofocus/>
        <input name="surname" type="text" placeholder="Naziwsko" required/>
        <input name="pesel" type="text" placeholder="Pesel" required/>
        <input name="birthDate" type="text" placeholder="Data urodzenia" required/>
        <button class="save" id="saveStudent" type="submit"> Zapisz </button>
        <button class="cancel" id="cancelAddingStudent" type="button" onclick="studentModal.close()"> Anuluj </button>
    </form>
</dialog>
</html>
